  - Name: OpenGL
    Type: Group
    Options:
      - Name: Recorder
        Type: Group
        Options:
          - Name: suppressExtensions
            Type: std::vector<std::string>
            Default:
              - GL_ARB_get_program_binary
          - Name: suppressProgramBinary
            Type: bool
            Default: true
            Description: Prevent the application from loading program binaries, which only the recording driver is guaranteed to load, so it compiles its shaders from source.
          - Name: persistentMapWriteTracking
            Type: OpenGLPersistentMapWriteTracking
            Default: WriteWatch
            OSVisibility: [WINDOWS]
            Description:
              How the recorder finds the application's writes to write-only coherent or
              implicit-flush persistent buffer maps, before each command that may read them.
              WriteWatch scans the whole mapping on each such command. PageProtection costs a
              page fault on the first write to each page after a scan, and suits applications
              that issue many commands per frame while writing little of large mappings.
              Readable persistent maps always use PageProtection.
          - Name: gpuWrittenMapRefresh
            Type: OpenGLGpuWrittenMapRefresh
            Default: OnAccess
            OSVisibility: [WINDOWS]
            Description:
              When the recorder copies GPU results into readable persistent buffer maps that GPU
              work may write. After a host sync, OnAccess copies each page from the driver mapping
              on its first read or write. OnRead copies it on its first read only. A page
              written first then keeps its earlier contents where the application does not write
              it, so reading those bytes later misses GPU results, and a write of the value the
              page held before is not recorded if GPU work changed that byte. It suits
              applications that only write such maps, or only read them, when reading the driver
              mapping is slow.
  - Name: Vulkan
    Type: Group
    Options:
      - Name: Shared
        Type: Group
        Options:
          - Name: suppressPhysicalDeviceFeatures
            Type: std::vector<std::string>
            Default: []
            Arguments: [suppressVKDeviceFeatures]
            Description:
              Disable physical device features during logical device creation.
              Option accepts list of comma (,) separated names of physical device features
              (as specified in the VkPhysicalDeviceFeatures structure definition).
          - Name: suppressExtensions
            Type: std::vector<std::string>
            Default:
              - VK_EXT_debug_marker
              - VK_EXT_shader_module_identifier
            Arguments: [suppressVKExtensions]
            Description:
              Disable extensions during instance and/or logical device creation.
              Option accepts list of comma (,) separated names of extensions.
      - Name: Player
        Type: Group
        Options:
          - Name: suppressLayers
            Type: std::vector<std::string>
            Default: []
            Arguments: [suppressVKLayers]
            Description:
              Disable layers requested by the recorded stream during replay.
              Option accepts list of comma (,) separated names of layers.
            LegacyPaths: ["Vulkan.Shared.SuppressLayers"]
          - Name: skipTraceRays
            Type: bool
            Default: false
            Arguments: [vkSkipTraceRays]
            Description:
              Diagnostic option. Skip vkCmdTraceRaysKHR and its indirect variants while
              still building acceleration structures. 
          - Name: skipAllRayTracing
            Type: bool
            Default: false
            Arguments: [vkSkipAllRayTracing]
            Description:
              Diagnostic option. Skip acceleration structure builds and copies as well as
              every trace rays command.
          - Name: enableNvDeviceDiagnosticCheckpoints
            Type: bool
            Default: false
            Description:
              Enable VK_NV_device_diagnostic_checkpoints during replay. GITS inserts a checkpoint
              before each recorded command-buffer command and reports the last reached command
              when the device is lost.
          - Name: enableExtDeviceFault
            Type: bool
            Default: false
            Description:
              Enable VK_EXT_device_fault during replay and report device fault addresses and
              vendor diagnostics when the device is lost.
          - Name: multithreadedShaderCompilation
            Type: bool
            Default: true
            Description:
              Use a thread pool to create pipelines concurrently in a background.
          - Name: Portability
            Type: Group
            Description:
              Adapts a stream recorded on one GPU for replay on a GPU with a
              different hardware configuration by patching Vulkan API parameters
              at replay time.
            Options:
              - Name: remapQueueFamilies
                Type: bool
                Default: false
                Arguments: [vkRemapQueueFamilies]
                Description:
                  Remap recorded queue family indices to compatible queue families
                  available on the replay device. The recorded (source) queue
                  family properties stored in the stream are matched against the
                  replay (target) device queue families by capability in a single
                  replay pass; colliding logical-device queue requests are merged.
              - Name: replaceAccelerationStructureScratch
                Type: bool
                Default: false
                Arguments: [vkReplaceAccelerationStructureScratch]
                Description:
                  Give acceleration structure builds scratch memory sized by the replay
                  driver instead of the recorded scratch regions, which were sized for
                  the recording driver. Disabled during subcapture.
              - Name: relocateSparseBuffers
                Type: bool
                Default: false
                Arguments: [vkRelocateSparseBuffers]
                Description:
                  Create sparse buffers whose recorded GPU virtual address range is not
                  available on the replay device at another address, and translate the
                  shader binding table addresses of ray tracing commands that point into
                  them. Without it, such a buffer fails to be created or, on drivers
                  that don't report the failure, aliases other memory. Disabled during
                  subcapture.
              - Name: realignUniformBuffers
                Type: bool
                Default: false
                Arguments: [vkRealignUniformBuffers]
                Description:
                  Make uniform buffer descriptors whose offset is not a multiple of the
                  replay device's minUniformBufferOffsetAlignment read from aligned
                  copies, refreshed by a copy at the start of every queue submission
                  that binds them. Such offsets are always reported; drivers may read
                  wrong data or hang on them (Mesa ANV). Disabled during subcapture.
              - Name: captureReplayAddressForm
                Type: VulkanCaptureReplayAddressForm
                Default: Auto
                Arguments: [vkCaptureReplayAddressForm]
                Description:
                  Form of the recorded memory opaque capture addresses passed to the
                  replay driver (Auto/Keep/Bits48/Canonical). Drivers report these
                  addresses either sign-extended (canonical) or zero-extended to 48
                  bits, and accept only their own form. Auto selects the 48-bit form
                  for Mesa ANV, the canonical form for the Intel Windows driver and
                  keeps the recorded addresses on other drivers.
              - Name: patchShaderGroupHandles
                Type: bool
                Default: false
                Description:
                  Enables Shader Group Handles patching in Shader Binding Tables during stream playback.
                  The patching mechanism injects a compute shader before ray tracing commands which
                  updates Shader Group Handles, potentially improving cross-platform compatibility of
                  streams. When patching is disabled, stream replay depends on a driver's support for
                  per ray tracing pipeline capture/replay features.
          - Name: waitAfterQueueSubmitWA
            Type: bool
            Default: false
            Arguments: [waitAfterQueueSubmitWA]
            Description: Vulkan specific option. This WA calls vkQueueWaitIdle after vkQueueSubmit.
          - Name: maxAllowedVkSwapchainRewinds
            Type: uint32_t
            Default: 100
            Arguments: [maxAllowedVkSwapchainRewinds]
            Description:
              Vulkan specific option. Changes the number of maximum allowed Vulkan
              swapchain rewinds (defaults to 100).
          - Name: ResourcesDump
            Type: Group
            Options:
              - Name: enabled
                Type: bool
                Default: false
                Description: Whether resource dumping is enabled or not
              - Name: commandKeys
                Type: std::string
                Default: ""
                Description:
                  Comma separated list of keys of vkQueueSubmit* calls or of commands recorded into
                  command buffers, as printed by the trace (S prefix for state restore keys).
                  Resources are dumped after the queue submission or after the command.
              - Name: resourceKeys
                Type: std::string
                Default: ""
                Description:
                  Comma separated list of keys of buffers and images to dump, as printed by the
                  trace (O prefix optional). Nothing is dumped if empty.
              - Name: format
                Type: ImageFormat
                Default: PNG
                Description: Image format (PNG/JPEG)
          - Name: RenderTargetsDump
            Type: Group
            Options:
              - Name: enabled
                Type: bool
                Default: false
                Description: Whether render targets dumping is enabled or not
              - Name: frames
                Type: std::string
                Default: ""
                Description: Frame range. For example '3-6'
              - Name: renderPasses
                Type: std::string
                Default: ""
                Description:
                  Range of render pass instances in each frame, counted from 1 in recording
                  order (supports multiple ranges and strides). For example '1-100:5'
              - Name: format
                Type: ImageFormat
                Default: PNG
                Description: Image format (PNG/JPEG)
              - Name: dryRun
                Type: bool
                Default: false
                Description:
                  Whether dry run is enabled or not. Lists the selected render pass instances
                  that have render targets instead of dumping them.
      - Name: Recorder
        Type: Group
        Options:
          - Name: suppressLayers
            Type: std::vector<std::string>
            Default: []
            Description:
              Disable layers during instance and/or logical device creation while recording.
              Option accepts list of comma (,) separated names of layers.
            LegacyPaths: ["Vulkan.Shared.SuppressLayers"]
          - Name: renderDocCompatibility
            Type: bool
            Default: true
            OSVisibility: [WINDOWS]

