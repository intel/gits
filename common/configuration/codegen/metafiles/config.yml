                Default: 1000
                Description: Number of API commands per CCode function (and file)
              - Name: wrapApiCalls
                Type: bool
                Default: false
                Description: All the API calls go through a global wrapper
                LongDescription: |
                    All the API calls go through a global wrapper. This makes it possible to change the behavior of any
                    given API call for the entire project.
