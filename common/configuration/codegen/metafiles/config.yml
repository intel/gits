Configuration:
  - Name: Common
    Type: Group
    Options:
      - Name: mode
        Type: GITSMode
        Default: ""
        Accessibility: Derived
      - Name: Shared
        Type: Group
        Options:
          - Name: thresholdLogLevel
            Type: LogLevel
            Default: INFO
            Arguments: [logLevel, loglevel]
            Description: Only info with level greater or equal to this will be logged.
            LongDescription:
              "The levels are: TRACEVERBOSE, TRACE, INFOVERBOSE, INFO (default),
              WARNING, ERROR and OFF. With TRACE level API calls are logged. With TRACEVERBOSE
              additional details are logged, for example in OGL streams log will contain
              state like list of bound framebuffers with attachments, pipelines, programs,
              shaders, buffers and textures."
            ConfigName: LogLevel
          - Name: logToConsole
            Type: bool
            Description: DEPRECATED, replaced by Common.Player.LogToConsole and Common.Recorder.LogToConsole.
            LongDescription:
              "High logging volume might slow GITS down, so if you use tracing or add plenty of
              debug logging, disabling logging to console can help you mitigate the performance hit.
              You still need to set up logging to a file if you want to see the output."
            Deprecated: true
          - Name: useEvents
            Type: bool
            Default: ""
            Accessibility: Derived
          - Name: scriptArgsStr
            Type: std::string
            Default: ""
            Accessibility: Derived
            Description:
              Lua script arguments. String with lua script arguments may be read
              by lua script.
          - Name: libGL
            Type: std::filesystem::path
            Default: ""
            Accessibility: ArgumentOnly
            Arguments: [libGLPath]
            Description: Override for library path containing GL functions
          - Name: HUD
            Description: GITS uses ImGui to display a HUD.
            Type: Group
            Options:
            - Name: Enabled
              Type: std::vector<ApiBool>
              Default: [DX, VK]
              Description: APIs for which to show the HUD during playback / recording. DX/VK only.
              Arguments: [hud]
            - Name: Position
              Type: HUDAnchor
              Default: TopRight
              Description: The position of the HUD.
            - Name: Opacity
              Type: float
              Default: 0.5
              Description: Opacity of the HUD
            - Name: UIScale
              InstanceName: uiScale
              Type: float
              Default: 1.0
              Description: Scales the HUD UI
            - Name: Fields
              Type: Group
              Options:
              - Name: ApplicationInfo
                Type: bool
                Default: true
                Description: Show the application info (name/pid)
              - Name: Version
                Type: bool
                Default: true
                Description: Show the GITS version currently running in the HUD
              - Name: BackBufferResolution
                Type: bool
                Default: true
                Description: Show the back buffer resolution in the HUD
              - Name: FrameNumber
                Type: bool
                Default: true
                Description: Show the current framenumber in the HUD
              - Name: FPS
                InstanceName: fps
                Type: bool
                Default: true
                Description: Show the FPS counter in the HUD
          - Name: waitForInput
            Type: bool
            Default: false
            Arguments: [waitForInput, waitForEnter]
            Description: Wait for user input before starting playback or recording
          - Name: Trace
            Type: Group
            Description:
              Trace is used to output a text file with all the API calls as they
              are being executed
            Options:
              - Name: enabled
                Type: bool
                Default: false
                Description: Whether tracing is enabled or not
                LegacyPaths: ["DirectX.Features.Trace.Enabled"]
              - Name: flushMethod
                Type: std::string
                Default: ipc
                Description: Method used to flush the trace file (off/ipc/file)
                LongDescription: |
                  Method used to flush the trace file.
                  Options:

                  * `off`: Does not flush the stream
                  * `ipc`: Flush into shared memory and save to file from a different process
                  * `file`: Flush directly into a file
                LegacyPaths: ["DirectX.Features.Trace.FlushMethod"]
              - Name: Print
                Type: Group
                Options:
                  - Name: postCalls
                    Type: bool
                    Default: true
                    Description: Print information after API calls
                    LegacyPaths: ["DirectX.Features.Trace.Print.PostCalls"]
                  - Name: preCalls
                    Type: bool
                    Default: false
                    Description: Print information before API calls
                    LegacyPaths: ["DirectX.Features.Trace.Print.PreCalls"]
                  - Name: debugLayerWarnings
                    Type: bool
                    Default: false
                    Description: Print debug layer warnings
                    LegacyPaths: ["DirectX.Features.Trace.Print.DebugLayerWarnings"]
                  - Name: gpuExecution
                    Type: bool
                    Default: false
                    Description: Print GPU execution information
                    ConfigName: gPUExecution
                    LegacyPaths: ["DirectX.Features.Trace.Print.GPUExecution"]
                  - Name: timestamp
                    Type: bool
                    Default: false
                    Description: Print a timestamp before each API call
                    LegacyPaths: ["DirectX.Features.Trace.Print.Timestamp"]
          - Name: Screenshots
            Type: Group
            Options:
              - Name: Enabled
                Type: bool
                Default: false
                Description: Whether screenshots are enabled or not
                LegacyPaths: ["DirectX.Features.Screenshots.Enabled"]
              - Name: Frames
                Type: std::string
                Default: ""
                Description:
                  Frame range (supports multiple ranges and strides). For example
                  '3-6:2,9'
                LegacyPaths: ["DirectX.Features.Screenshots.Frames"]
              - Name: Format
                Type: ImageFormat
                Default: PNG
                Description: Format (PNG/JPEG/DDS)
                LegacyPaths: ["DirectX.Features.Screenshots.Format"]
      - Name: Player
        Type: Group
        Options:
          - Name: execute
            Type: bool
            Default: true
            Description: Execute the API commands (driver / null driver)
            LegacyPaths: ["DirectX.Player.Execute"]
          - Name: plugins
            Type: std::vector<std::string>
            Default: []
            Description: List of plugins to enable during playback
            LongDescription: |
              GITS plugins are shared libraries that are loaded by GITS Player at runtime.
              This option is shared by all backends (DirectX12 and Vulkan).
            LegacyPaths: ["DirectX.Player.Plugins", "DirectX.Playback.Plugins"]
          - Name: Subcapture
            Type: Group
            Description:
              Common subcapture settings shared across all APIs (Vulkan, DirectX).
              API-specific options live in dedicated subsections (e.g. DirectX).
            Options:
              - Name: enabled
                Type: bool
                Default: false
                Description: Whether subcapture is enabled or not
                LegacyPaths: ["DirectX.Features.Subcapture.Enabled"]
              - Name: frames
                Type: std::string
                Default: ""
                Description: Frame range for subcapture, e.g. '3' or '3-6'
                LegacyPaths: ["DirectX.Features.Subcapture.Frames"]
              - Name: optimize
                Type: bool
                Default: true
                Description: Uses optimization information from subcapture analysis to restore only necessary objects
                LegacyPaths: ["DirectX.Features.Subcapture.Optimize"]
              - Name: compressionType
                Type: CompressionType
                Default: ZSTD
                Description: Compression type for the subcapture output stream (LZ4/ZSTD)
                LegacyPaths: ["DirectX.Features.Subcapture.CompressionType"]
              - Name: DirectX
                Type: Group
                Description:
                  DirectX-specific subcapture settings. Only used by the DirectX backend.
                Options:
                  - Name: serializeAccelerationStructures
                    Type: bool
                    Default: false
                    LegacyPaths: ["DirectX.Features.Subcapture.SerializeAccelerationStructures"]
                  - Name: restoreTLASes
                    Type: bool
                    Default: false
                    LegacyPaths: ["DirectX.Features.Subcapture.RestoreTLASes"]
                  - Name: restoreReleasedCB
                    Type: bool
                    Default: false
                    Description: Restore released placed resource object for constant buffer view
                  - Name: forceDirectCommandListType
                    Type: bool
                    Default: false
                    Description: During subcapture state tracking, create compute command queues, allocators, and command lists as direct
                  - Name: commandListExecutions
                    Type: std::string
                    Default: ""
                    Description: Command lists executions range for command lists subcapture, can be used only with serialized executions stream
                    LegacyPaths: ["DirectX.Features.Subcapture.CommandListExecutions"]
                  - Name: executionSerialization
                    Type: bool
                    Default: false
                    Description: Creates stream with serialized CPU and GPU execution, each command list in separate execution
                    LegacyPaths: ["DirectX.Features.Subcapture.ExecutionSerialization"]
                  - Name: executionSerializationNonSeparated
                    Type: bool
                    Default: false
                    Description: Creates stream with serialized CPU and GPU execution, command lists not separated
                  - Name: commandListSplit
                    Type: std::string
                    Default: ""
                    Description: Split serialized stream at command list command keys. For example, '42' (where '42' is a command key of a draw call) will extract the draw call into a separate execution containing only that draw call and the necessary command list state restoration commands. Multiple keys and key ranges are supported. Ranges containing only state commands are invalid. Use 'all' to split at every GPU work command. Leave empty to disable.
                    LegacyPaths: ["DirectX.Features.Subcapture.CommandListSplit"]
              - Name: Vulkan
                Type: Group
                Description:
                  Vulkan-specific subcapture settings. Only used by the Vulkan backend.
                Options:
                  - Name: captureASBuildInputs
                    Type: bool
                    Default: true
                    Description: When true (default), captures acceleration structure build inputs and rebuilds the AS on replay - portable across GPUs and drivers. When false, restores them via serialize/deserialize (not portable).
          - Name: logToConsole
            Type: bool
            Default: true
          - Name: applicationPath
            Type: std::filesystem::path
            Default: ""
            Accessibility: Derived
          - Name: stats
            Type: bool
            Default: ""
            Accessibility: ArgumentOnly
            Arguments: [stats, s]
            Description:
              GITS will not play specified file but instead will create some
              statistics about it.
          - Name: diags
            Type: bool
            Default: ""
            Accessibility: ArgumentOnly
            Arguments: [recorderDiags]
            Description:
              Causes player to output diagnostic info gathered during stream
              recording. Then, player exits.
          - Name: ExecutableNameOverride
            Type: Group
            Description: Renames GITS Player before playing back the stream
            LongDescription: |
              Renames GITS Player before playing back the stream.
              If CustomName is empty, the original name of the captured application found in the stream will be used (if available).
            Options:
              - Name: Enabled
                Type: bool
                Default: false
                Description: Set gitsPlayer executable name to the name of the original executable (if available)
                LongDescription: |
                  Before playback, GITS Player will copy its executable and rename it to the original name of the captured application (if available).
                  Then it will launch a new process using that executable.
              - Name: CustomName
                Type: std::string
                Default: ""
                Description: Set a custom executable name for gitsPlayer executable
                LongDescription: |
                  Before playback, GITS Player will copy its executable and rename it to the given name.
                  Then it will launch a new process using that executable.
          - Name: libGL
            Type: std::filesystem::path
            Default: libGL.so.1
            DefaultsPerPlatform:
              - win32: OpenGL32.dll
              - lnx_32: libGL.so
          - Name: libVK
            Type: std::filesystem::path
            Default: libvulkan.so.1
            DefaultsPerPlatform:
              - win32: vulkan-1.dll
          - Name: streamPath
            Type: std::filesystem::path
            Default: ""
          - Name: streamDir
            Type: std::filesystem::path
            Default: ""
            Accessibility: Derived
          - Name: subcapturePath
            Type: std::filesystem::path
            Default: "{install_path}\\dump\\%f%_%r%"
          - Name: tokenBurst
            Type: uint32_t
            Default: 10000
            Arguments: [tokenBurstLimit]
            Description:
              Specifies number of tokens to be loaded from stream file in one
              burst. Burst is a group of tokens that have to be all loaded before execution
              of first token in a burst will start. This option is mutually exclusive with
              loadWholeStreamBeforePlayback option.
            ConfigName: tokenBurstLimit
          - Name: tokenBurstNum
            Type: uint32_t
            Default: 5
            Arguments: [tokenBurstNum]
            Description:
              Specifies maximum number of 'bursts' loaded, waiting for execution,
              at any one time by player
          - Name: tokenBurstChunkSize
            Type: uint64_t
            Default: 5242880
            Description: "Default size: 5 MB"
          - Name: exitFrame
            Type: uint32_t
            Default: 1000000
            Arguments: [exitFrame]
            Description: Stop playback after this frame.
          - Name: endFrameSleep
            Type: uint32_t
            Default: 0
            Description: Sleep this many milliseconds after a swap.
            Arguments: [endFrameSleep]
          - Name: useEvents
            Type: bool
            Default: ""
            Accessibility: Derived
          - Name: eventScript
            Type: std::filesystem::path
            Default: ""
            Arguments: [eventScript]
            Description: Path to lua event script.
            LongDescription: |
              Path to lua event script.
              Following functions can be provided in script file for event handlers:

              * all GL / WGL / EGL / GLX functions
              * gitsFrameBegin(nr)
              * gitsFrameEnd(nr)
              * gitsLoopBegin(nr)
              * gitsLoopEnd(nr)
              * gitsStateRestoreBegin()
              * gitsStateRestoreEnd()
              * gitsProgramStart()
              * gitsProgramExit()

              Following functions exposed by GITS may be used inside lua scripts:

              * string udtToStr(userdata udt) - casts lua userdata to string.
              * number udtToInt(userdata udt) - casts user data to int.
              * userdata getUdt(userdata carray, number index) - extracts userdata from carray's index.
              * number getInt(userdata carray, number index) - extracts int from carray's index.
              * number getFloat(userdata carray, number index) - extracts float from carray's index.
              * void setUdt(userdata carray, number index, number value) - sets userdata at array's index.
              * void setInt(userdata carray, number index, number value) - sets int at array's index.
              * void setFloat(userdata carray, number index, number value) - sets float at array's index.
              * userdata nullUdt() - returns null user data \(void*)0\.
              * number currTime() - returns time in microseconds from the start of the player.
              * void msgBox(string title, string message, number type) - Windows exclusive functions.Displays a message box with arbitral title, message and typ.
              * userdata allocBytes(number size) - Allocates memory and returns userdata(pointer to allocated data in C).
              * void freeBytes(userdata pointer) - Deallocates memory.
              * string getArgsStr() - returns string with args passed through gitsPlayer option --scriptArgsStr.
              * string getOutDir() - returns output directory for artifacts defined with gitsPlayer option --outputDir.
              * gitsGlDebugProc() - returns userdata containing pointer to callback function which is being set by glDebugMessageCallback.
          - Name: scriptArgsStr
            Type: std::string
            Default: ""
            Arguments: [scriptArgsStr]
            ConfigName: scriptArgs
          - Name: benchmark
            Type: bool
            Default: false
            Arguments: [benchmark, b]
            Description: Enables performance measurement in OpenGL streams on frame base. Results are being stored in benchmark.csv file in CWD or
          - Name: showWindowBorder
            Type: bool
            Default: true
            Arguments: [showWindowBorder]
            Description: Forces player to show window border (ignored in fullscreen).
          - Name: showFrameNumberInTitle
            Type: bool
            Default: false
            Arguments: [showFrameNumberInTitle]
            Description: Updates the window title with the current frame number every frame (requires showWindowBorder to be visible).
          - Name: captureFrames
            Type: BitRange
            Default: "-"
            Arguments: [captureFrames]
            Description: List of frames that will be captured by gits during playback.
            LongDescription: |
              List of frames that will be captured  during playback. 
              Specified as single string without spaces of  following format:

              * pattern = frame_list | frame_list/Repeat-Count
              * frame_list = element | frame_list, ',', element
              * element = Frame | Begin-End | Begin-End:Step
          - Name: outputDir
            Type: std::filesystem::path
            Default: ""
            Arguments: [outputDir]
            Description: Specifies directory where all the artifacts will be stored.
          - Name: traceSelectedFrames
            Type: BitRange
            Default: "-"
            Arguments: [traceSelectedFrames]
            Description: List of frames for which trace (log) will be generated during playback.
            LongDescription: |
              List of frames for which trace (log) will be generated during playback.
              Specified as a single string without spaces with the following format:

              * pattern = frame_list | frame_list/Repeat-Count
              * frame_list = element |frame_list, ',', element
              * element = Frame | Begin-End | Begin-End:Step
          - Name: interactive
            Type: bool
            Default: false
            Arguments: [i, interactive]
            Description: Enables the interactive mode.
          - Name: outputTracePath
            Type: std::filesystem::path
            Default: ""
            Arguments: [outputTracePath]
            Description: Specifies directory path where gits traces will be stored.
          - Name: logFncs
            Type: bool
            Default: false
            Arguments: [logFncs]
            Description: All played tokens are logged to standard output.
          - Name: faithfulThreading
            Type: bool
            Default: false
            Arguments: [faithfulThreading]
            Description:
              GITS, by default, plays the stream in single thread, synthesizing
              necessary GL context switches. This option causes GITS to use as many threads
              as original application for playback. This also makes it impossible to create
              a subcapture from the stream.
          - Name: loadWholeStreamBeforePlayback
            Type: bool
            Default: false
            Arguments: [loadWholeStreamBeforePlayback]
            Description:
              Forces load of entire stream to memory before playback. May cause
              memory issues and errors related to max value being exceeded. This option
              is mutually exclusive with tokenBurstLimit option.
          - Name: showWindowsWA
            Type: bool
            Default: false
            Arguments: [showWindowsWA]
            Description: Enables workaround that makes all windows visible all the time by default.
          - Name: disableExceptionHandling
            Type: bool
            Default: false
            Arguments: [noseh, x]
            Description:
              DEPRECATED. GITS does not handle exceptions during playback. This option was used to disable exception handling.
              GITS now behaves as if this option is always enabled.
            Deprecated: true
          - Name: logLoadedTokens
            Type: bool
            Default: false
            Arguments: [logLoadedTokens]
            Description: Prints token names after they are loaded.
          - Name: escalatePriority
            Type: bool
            Default: false
            Arguments: [realtime]
            Description:
              If specified, gitsPlayer will request realtime priority from the
              system.
          - Name: swapAfterPrepare
            Type: bool
            Default: false
            Arguments: [swapAfterPrepare]
            Description:
              If specified, gitsPlayer will issue additional swap after state
              restoration calls.
          - Name: stopAfterFrames
            Type: BitRange
            Default: "-"
            Arguments: [stopAfterFrames]
            Description: List of frames to stop after  during playback.
            LongDescription: |
              List of frames to stop after during playback. Specified as single string without spaces of following format:

              * pattern = frame_list | frame_list/Repeat-Count  
              * frame_list = element | frame_list, element
              * element = Frame | Begin-End | Begin-End:Step
          - Name: nullRun
            Type: bool
            Default: false
            Arguments: [nullRun]
            Description:
              No functions are played back. This option is useful only for characterization
              of GITS player framework performance.
          - Name: renderOffscreen
            Type: bool
            Default: false
            Arguments: [renderOffscreen]
            Description: Forces offscreen rendering in EGL, Vulkan or DirectX 12.
            LongDescription: |
              Offscreen rendering:

              - in EGL to a pbuffer,
              - in Vulkan to a swapchain without presentation,
              - in DirectX 12 to swapchains that are not bound to any window (no window is created).

              Not supported for other API types. Use --captureFrames or similar option to get rendering output.
          - Name: forceOrigScreenResolution
            Type: bool
            Default: false
            Arguments: [forceOrigScreenResolution]
            Description:
              Forces player to set original screen resolution used during recording.
              Useful to replay full screen mode.
          - Name: forceInvisibleWindows
            Type: bool
            Default: false
            Arguments: [forceInvisibleWindows]
            Description: Forces windows to be hidden.
          - Name: fullscreen
            Type: bool
            Default: false
            Arguments: [fullscreen, f]
            Description:
              Attempts to display the window in the exclusive fullscreen mode
              for maximum performance. Window covers everything, including OS bars, docks,
              etc. Display resolution gets changed if necessary to match the stream dimensions.
          - Name: windowMode
            Type: WindowMode
            Default: ""
            Accessibility: Derived
          - Name: ForceWindowPosStr
            Type: std::string
            Default: ""
            Accessibility: ArgumentOnly
            Arguments: [forceWindowPos]
            Description:
              Specified coordinates (e.g. 100x100) will be used as position of  all
              windows created during stream playback. Window position updates will be inhibited.
          - Name: ForceWindowPos
            Type: Group
            Options:
              - Name: enabled
                Type: bool
                Default: false
              - Name: x
                Type: uint32_t
                Default: 0
              - Name: y
                Type: uint32_t
                Default: 0
          - Name: ForceWindowSizeStr
            Type: std::string
            Default: ""
            Accessibility: ArgumentOnly
            Arguments: [forceWindowSize]
            Description: Forces windows, viewport and scissor box sizes to specified  values.
          - Name: ForceWindowSize
            Type: Group
            Options:
              - Name: enabled
                Type: bool
                Default: false
              - Name: width
                Type: uint32_t
                Default: 0
              - Name: height
                Type: uint32_t
                Default: 0
          - Name: ForceDesktopResolutionStr
            Type: std::string
            Default: ""
            Accessibility: ArgumentOnly
            Arguments: [forceDesktopResolution]
            OSVisibility: [WINDOWS]
            Description:
              Forces specified desktop resolution before playing stream. Returns
              to previous resolution after execution. Accepts 'width,height' argument. E.g.
              --forceDesktopResolution 1024,768
          - Name: ForceDesktopResolution
            Type: Group
            ConfigName: forceDesktopResolution
            OSVisibility: [WINDOWS]
            Options:
              - Name: enabled
                Type: bool
                Default: false
              - Name: width
                Type: uint32_t
                Default: 0
              - Name: height
                Type: uint32_t
                Default: 0
      - Name: Recorder
        Type: Group
        Options:
          - Name: plugins
            Type: std::vector<std::string>
            Default: [Benchmark]
            Description: List of plugins to enable during recording
            LongDescription: |
              GITS plugins are shared libraries that are loaded by GITS Recorder at runtime.
              This option is shared by all backends (DirectX12 and Vulkan).
            LegacyPaths: ["DirectX.Recorder.Plugins", "DirectX.Capture.Plugins"]
          - Name: enabled
            Type: bool
            Default: true
            Description: Whether recording is enabled or not
            LongDescription: |
              Whether recording is enabled or not.
              Recorder can be disabled so GITS acts as an interceptor that allows for tracing, logging etc.
          - Name: logToConsole
            Type: bool
            Default: false
          - Name: libGL
            Type: std::filesystem::path
            Default: /usr/lib/{arch}-linux-gnu/libGL.so.1
            DefaultsPerPlatform:
              - win32: C:\Windows\System32\OpenGL32.dll
          - Name: libVK
            Type: std::filesystem::path
            Default: /usr/lib/{arch}-linux-gnu/libvulkan.so.1
            DefaultsPerPlatform:
              - win32: C:\Windows\System32\vulkan-1.dll
          - Name: recordingMode
            Type: RecordingMode
            Deprecated: true
            Description:
              DEPRECATED because CCode was removed. Replaced by Common.Recorder.Enabled.
          - Name: exitKeysStr
            Type: std::vector<std::string>
            Default: []
            ConfigName: exitKeys
          - Name: exitKeys
            Type: std::vector<uint32_t>
            Default: []
            Accessibility: Derived
          - Name: exitAfterAPICall
            Type: uint32_t
            Default: 0
          - Name: exitSignal
            Type: uint32_t
            Default: 12
            OSVisibility: [X11]
            Accessibility: Derived
          - Name: tokenBurst
            Type: uint32_t
            Default: 10000
            ConfigName: tokenBurstLimit
          - Name: tokenBurstNum
            Type: uint32_t
            Default: 5
          - Name: tokenBurstChunkSize
            Type: uint64_t
            Default: 5242880
          - Name: installPath
            Type: std::filesystem::path
            Default: "{install_path}/Recorder"
            DefaultsPerPlatform:
              - win32: "{install_path}\\Recorder"
            ConfigName: InstallationPath
          - Name: dumpPath
            Type: std::filesystem::path
            Default: "{install_path}/dump/stream-%p%"
            DefaultsPerPlatform:
              - win32: "{install_path}\\dump\\%n%_%p%"
            ConfigName: dumpDirectoryPath
          - Name: uniqueDumpDirectory
            Type: bool
            Default: true
          - Name: useEvents
            Type: bool
            Default: ""
            Accessibility: Derived
          - Name: eventScript
            Type: std::filesystem::path
            Default: ""
          - Name: scriptArgsStr
            Type: std::string
            Default: ""
            ConfigName: scriptArgs
          - Name: Compression
            Type: Group
            Options:
              - Name: type
                Type: CompressionType
                Default: LZ4
                DefaultCondition:
                  - is_directx: ZSTD
                  - is_vulkan: ZSTD
                  - is_opengl: ZSTD
              - Name: level
                Type: uint32_t
                Default: 10
                DefaultCondition:
                  - is_directx: 3
                  - is_vulkan: 3
                  - is_opengl: 3
              - Name: chunkSize
                Type: uint32_t
                Default: 2097152
          - Name: extendedDiagnosticInfo
            Type: bool
            Default: true
            ConfigName: extendedDiagnostic
          - Name: forceDumpOnError
            Type: bool
            Default: true
          - Name: highIntegrity
            Type: bool
            Default: false
          - Name: nullIO
            Type: bool
            Default: false
          - Name: benchmark
            Type: bool
            Default: true
          - Name: closeAppOnStopRecording
            Type: bool
            Default: true
            OSVisibility: [WINDOWS]
          - Name: windowsKeyHandling
            Type: WindowsKeyHandling
            Default: MessageLoop
            OSVisibility: [WINDOWS]
  - Name: DirectX
    Type: Group
    OSVisibility: [WINDOWS]
    Options:
      - Name: Player
        Type: Group
        Options:
          - Name: debugLayer
            Type: bool
            Default: false
            Description: Enable the DirectX Debug Layer
            LegacyPaths: ["DirectX.Playback.DebugLayer"]
          - Name: waitOnEventCompletion
            Type: bool
            Default: false
            Description: CPU waits for GPU on SetEventOnCompletion and SetEventOnMultipleFenceCompletion
            LegacyPaths: ["DirectX.Playback.WaitOnEventCompletion"]
          - Name: useCopyQueueOnRestore
            Type: bool
            Default: false
            Description: Use a D3D12_COMMAND_LIST_TYPE_COPY to restore resource states
            LegacyPaths: ["DirectX.Playback.UseCopyQueueOnRestore"]
          - Name: skipResolveQueryData
            Type: bool
            Default: true
            Description: Don't replay ID3D12GraphicsCommandList::ResolveQueryData commands
            LegacyPaths: ["DirectX.Playback.SkipResolveQueryData"]
          - Name: infiniteWaitForFence
            Type: bool
            Default: false
            Description:
              Set the timeout to INFINITE when waiting for fences (GPU to CPU synchronization) instead
              of the default (5sec)
            LegacyPaths: ["DirectX.Playback.InfiniteWaitForFence"]
          - Name: nonIncrementalFenceWait
            Type: bool
            Default: true
            Description:
              Use GpuExecutionTracker during replay to skip unreachable fence waits and apply reachable ones
              when fence values are not incremental
          - Name: multithreadedShaderCompilation
            Type: bool
            Default: true
            Description:
              Use a thread pool for D3D12 methods which cause hardware shader
              compilation
            LegacyPaths: ["DirectX.Playback.MultithreadedShaderCompilation"]
          - Name: enableAgilitySDKDllAppOverride
            Type: bool
            Default: false
            Description: Enable usage of AglitySDK DLL captured from the app
            LegacyPaths: ["DirectX.Playback.EnableAgilitySDKDllAppOverride"]
          - Name: enableXessDllAppOverride
            Type: bool
            Default: true
            Description: Enable usage of Xess DLL captured from the app
            LegacyPaths: ["DirectX.Playback.EnableXessDllAppOverride"]
          - Name: enableXellDllAppOverride
            Type: bool
            Default: true
            Description: Enable usage of Xell DLL captured from the app
          - Name: enableXefgDllAppOverride
            Type: bool
            Default: true
            Description: Enable usage of XeSS FG DLL captured from the app
          - Name: patchGpuBuffers
            Type: bool
            Default: true
            Description:
              Enable patching of IABs and SBTs on the GPU.
              This will translate GPUVAs and other runtime data on captured GPU buffers.
            LegacyPaths: ["DirectX.Playback.PatchGpuBuffers"]
          - Name: AdapterOverride
            Type: Group
            Description:
              "Select the adapter used on D3D12CreateDevice. Set the Vendor and
              Index for that vendor (or global index if Vendor is empty). For example: Index:
              1, Vendor: 'Intel' will select the second Intel adapter enumerated."
            Options:
              - Name: enabled
                Type: bool
                Default: false
                Description: Whether adapter override is enabled or not
                LegacyPaths: ["DirectX.Playback.AdapterOverride.Enabled"]
              - Name: index
                Type: uint32_t
                Default: 0
                Description: Index of the adapter to use
                LegacyPaths: ["DirectX.Playback.AdapterOverride.Index"]
              - Name: vendor
                Type: std::string
                Default: ""
                Description: Vendor of the adapter (Empty / AMD / NVIDIA / Intel).
                LegacyPaths: ["DirectX.Playback.AdapterOverride.Vendor"]
          - Name: ApplicationInfoOverride
            Type: Group
            Description:
              Override arguments for INTC_D3D12_SetApplicationInfo. By default
              only the ApplicationName will be set and it will use the Process Name from
              capture.
            Options:
              - Name: enabled
                Type: bool
                Default: false
                Description: Whether application info override is enabled or not
                LegacyPaths: ["DirectX.Playback.ApplicationInfoOverride.Enabled"]
              - Name: applicationName
                Type: std::string
                Default: ""
                Description: Application name
                LegacyPaths: ["DirectX.Playback.ApplicationInfoOverride.ApplicationName"]
              - Name: applicationVersion
                Type: std::string
                Default: 0.0.0
                Description: "Application version: 'major.minor.patch', Example: '1.2.3'"
                LegacyPaths: ["DirectX.Playback.ApplicationInfoOverride.ApplicationVersion"]
              - Name: engineName
                Type: std::string
                Default: ""
                Description: Engine name
                LegacyPaths: ["DirectX.Playback.ApplicationInfoOverride.EngineName"]
              - Name: engineVersion
                Type: std::string
                Default: 0.0.0
                Description: "Engine version: 'major.minor.patch', Example: '1.2.3'"
                LegacyPaths: ["DirectX.Playback.ApplicationInfoOverride.EngineVersion"]
          - Name: Portability
            Type: Group
            Options:
              - Name: resourcePlacement
                Type: std::string
                Default: none
                Description: Portability feature to use for placed resources (use/store/none)
                LongDescription: |
                  Portability feature to use for placed resources.
                  Options:

                  * `none`: Don't do anything special (playback the stream as-is)
                  * `use`: Use existing file containing placed resources data
                  * `store`: Create a file containing placed resources data. Disabling execution allows to collect data on incompatible device.
                LegacyPaths: ["DirectX.Playback.Portability.ResourcePlacement"]
              - Name: portabilityChecks
                Type: bool
                Default: false
                Description: Checks and logs portability issues
                LegacyPaths: ["DirectX.Playback.Portability.PortabilityChecks"]
              - Name: portabilityAssertions
                Type: bool
                Default: true
                Description: Ends playback if any incompatibility is detected
                LegacyPaths: ["DirectX.Playback.Portability.PortabilityAssertions"]
              - Name: raytracingAssertions
                Type: bool
                Default: false
                Description: Ends playback when raytracing acceleration structure validation fails
                LongDescription: |
                  Validates raytracing acceleration structure builds, copies, and uses in GPU execution order.
                  Checks post-build sizes and that each build fits its buffer or heap range. Validates scratch buffer
                  size against live prebuild info for each build. Tracks TLAS, BLAS and OMM dependencies.
                  Aborts playback when a structure is overwritten, released, never built or otherwise invalid.
                  Uses extra GPU readbacks and barriers during replay.
                  Does not validate shader or dispatch usage of acceleration structures.
              - Name: forcePlacedToCommittedResources
                Type: bool
                Default: false
                Description: Force all placed resource creation calls to use committed resources instead                
              - Name: useStbImage
                Type: bool
                Default: false
                Description: Use stb_image for resource (and screenshot) dumping
                LongDescription: |
                  Use stb_image for resource (and screenshot) dumping. 
                  By default GITS uses Windows Imaging Component (WIC) to save images. WIC may not always be supported on the target platform.
          - Name: AddressPinning
            Type: AddressPinningMode
            Default: None
            Description: None / Use - Recreate resources and heaps at capture-time GPUVAs / Store - Dump file with GPUVAs
            LegacyPaths: ["DirectX.Playback.AddressPinning"]
